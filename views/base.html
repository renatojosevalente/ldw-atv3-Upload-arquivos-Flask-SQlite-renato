<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <title>Loja de veículos</title>
    <style>
        nav {
            background-color: rgb(6, 27, 117);
            padding: 10px 0;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        nav a:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Veículos novos e usados</h1>
        <nav>
            <a href="{{url_for('home')}}">Home</a>
            <a href="{{url_for('estoque')}}">Veículos</a>
            <a href="{{url_for('galeria')}}">Galeria</a>
        </nav>
        <hr>
    </header>
    
    {% block content %}
    <!--Conteúdo da página-->

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    {% endblock content %}
    
    <footer>
        <hr>
        <p style="text-align: center;">Todos os direitos reservados</p>
    </footer>
</body>
</html>
