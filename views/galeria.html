<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends 'base.html' %}
    {% block content %}

    <h2 style="text-align: center;">Envie a foto do seu veículo</h2><br>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
     <div class="alert alert-{{ category }}">
        {{ message }}
     </div>
        {% endfor %}
    {% endwith %}

    <div class="row">
        {% for img in imagens %}
            <div class="col-md-3 m-auto">
                <img src="/static/uploads/{{img.filename}}" 
               class="img-thumbnail">
            </div>
        {% endfor %}
     </div>
     
    <div class="container col-6">
        <div class="card mt-4">
            <div class="card-body">
                <form action="{#{url_for('galeria')}#}" method="post" enctype="multipart/form-data">
                    <label for="file">Envie aqui a foto do veículo: </label>
                    <input class="form-control" name="file" type="file" required><br>
                    <button type="submit" class="btn btn-danger btn-block">Enviar</button>
                </form>
            </div>
        </div>
    </div>
    
    {% endblock content %}  
</body>
</html>
