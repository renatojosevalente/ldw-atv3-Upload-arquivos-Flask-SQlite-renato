<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <title>Editar cadastro</title>
</head>
<body>
{% extends 'base.html'%}
{% block content %}
<div class="col-md-6 m-auto">
    <h3 style="text-align: center;">Editar veículo</h3>
        <form action="{{url_for('editar', id=v.id)}}" method="POST">
            <input type="text" name="marca" class="form-control" value="{{v.marca}}" required>
            <input type="text" name="modelo" class="form-control" value="{{v.modelo}}" required>
            <input type="number" name="ano" class="form-control" value="{{v.ano}}" required>
            <input type="text" name="cor" class="form-control" value="{{v.cor}}" required>
            <input type="text" name="combustivel" class="form-control" value="{{v.combustivel}}" required>
            <input type="number" name="preco"  value="{{v.preco}}" min="0" step="0.01" class="form-control" required>
            <input type="number" name="estoque" value="{{v.estoque}}" class="form-control" required>
        <br>
        <a href="{{url_for('editar', id=v.id)}}" onclick="return confirm('Confirma as alterações?')"><input type="submit" value="Alterar" class="btn btn-warning"></a>
        <a href="{{url_for('estoque')}}"><input type="button" value="Cancelar" class="btn btn-danger"></a>
    </form>
</div>
{% endblock content %}
</body>
</html>
